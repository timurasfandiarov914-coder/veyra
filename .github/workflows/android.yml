name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Veyra APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore stable debug signing key
        id: signing
        env:
          VEYRA_DEBUG_KEYSTORE_BASE64: ${{ secrets.VEYRA_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$VEYRA_DEBUG_KEYSTORE_BASE64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No stable signing key configured. Add repository Actions secret VEYRA_DEBUG_KEYSTORE_BASE64 to create update-compatible APKs."
            exit 0
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$VEYRA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon --stacktrace -PversionCode="$GITHUB_RUN_NUMBER" assembleDebug

      - name: Prepare fixed-name APK
        if: steps.signing.outputs.ready == 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk Veyra.apk

      - name: Upload APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-APK
          path: Veyra.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report required setup
        if: steps.signing.outputs.ready != 'true'
        run: |
          echo "Build skipped to protect update compatibility."
          echo "Add repository secret VEYRA_DEBUG_KEYSTORE_BASE64 and rerun this workflow."
